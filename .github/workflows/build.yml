name: Build Flame Fist
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x
      - name: Build
        run: dotnet build FlameFist.csproj --configuration Release
      - name: Package mod
        shell: bash
        run: |
          mkdir -p package/FlameFist
          cp manifest.json package/FlameFist/
          cp bin/Release/net6.0/FlameFist.dll package/FlameFist/
          cd package
          zip -r ../FlameFist-Android-test.zip FlameFist
      - name: Upload mod ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Flame-Fist-test-build
          path: FlameFist-Android-test.zip
